<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AcademicHub — Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: linear-gradient(135deg, #1e1b4b 0%, #1a1a2e 100%);
      border: 1px solid #312e81;
      border-radius: 16px;
      padding: 48px;
      max-width: 560px;
      width: 90%;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }
    .logo {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; margin: 0 auto 24px;
    }
    h1 { font-size: 2rem; font-weight: 700; color: #a5b4fc; margin-bottom: 8px; }
    p  { color: #94a3b8; margin-bottom: 32px; line-height: 1.6; }
    .badges { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 32px; }
    .badge {
      background: #312e81;
      color: #a5b4fc;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-block;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; }
    .btn-outline { border: 1px solid #6366f1; color: #a5b4fc; }
    .status {
      margin-top: 28px;
      display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;
    }
    .status-item { font-size: 0.8rem; color: #64748b; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .green { background: #22c55e; }
    .yellow { background: #eab308; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🎓</div>
    <h1>AcademicHub</h1>
    <p>Full-stack academic management platform. Manage resources, study groups, Q&A, and AI-powered study tools.</p>
    <div class="badges">
      <span class="badge">React 19</span>
      <span class="badge">Express.js</span>
      <span class="badge">MongoDB</span>
      <span class="badge">TailwindCSS</span>
      <span class="badge">Vercel</span>
    </div>
    <div class="links">
      <a class="btn btn-primary" href="http://localhost:5173" target="_blank">🚀 Open App</a>
      <a class="btn btn-outline" href="http://localhost:5000/health" target="_blank">⚙️ API Health</a>
    </div>
    <div class="status">
      <span class="status-item"><span class="dot green"></span>Frontend :5173</span>
      <span class="status-item"><span class="dot yellow"></span>Backend :5000</span>
    </div>
  </div>
</body>
</html>
